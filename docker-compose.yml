version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: obrafacil
      POSTGRES_USER: obrafacil
      POSTGRES_PASSWORD: obrafacil
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000","9001:9001"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/obrafacil
      SPRING_DATASOURCE_USERNAME: obrafacil
      SPRING_DATASOURCE_PASSWORD: obrafacil
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8080:8080"]
    depends_on: [postgres,minio,redis]
volumes:
  pgdata:
